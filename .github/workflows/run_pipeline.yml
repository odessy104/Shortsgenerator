name: Run YouTube Shorts Pipeline

on:
  workflow_dispatch:
    inputs:
      themes:
        description: 'Themen für die Shorts (mehrere durch Komma getrennt)'
        required: true
        default: 'Künstliche Intelligenz, Raumfahrt, Psychologie'
        type: string

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: System-Pakete installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libasound2-dev

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install edge-tts openai-whisper moviepy requests pillow numpy

      - name: Pipeline starten
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          THEMEN_LISTE: ${{ github.event.inputs.themes }}
          GITHUB_ACTIONS: "true"
        run: |
          python hybrid_pipeline.py

      - name: Release fertige Shorts hochladen
        uses: ncipollo/release-action@v1
        with:
          artifacts: "output/*.mp4"
          tag: "short-${{ github.run_number }}"
          name: "YouTube Short #${{ github.run_number }}"
          body: "Automatisch generierte YouTube Shorts."
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push result.json
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add result.json || true
          git commit -m "chore: update result.json with latest video title [skip ci]" || echo "No changes to commit"
          git push || true
