name: Run YouTube Shorts Pipeline

on:
  workflow_dispatch:
    inputs:
      themen:
        description: 'Themen für die Shorts (mehrere durch Komma getrennt)'
        required: true
        default: 'Künstliche Intelligenz, Raumfahrt, Psychologie'
        type: string

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: System-Pakete installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pipeline starten
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          THEMEN_LISTE: ${{ github.event.inputs.themen }}
        run: |
          python hybrid_pipeline.py
      - name: Release fertige Shorts hochladen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shorts-run-${{ github.run_number }}
          name: "🎬 Shorts Run #${{ github.run_number }}"
          files: output/*.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
