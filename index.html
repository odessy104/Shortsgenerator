<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Shorts Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: #ff0033;
        }
        button {
            background-color: #ff0033;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #cc0029;
        }
        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #a0a0a0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Shorts Cloud Generator</h1>
        <p>Trage deine Themen ein (eines pro Zeile oder mit Komma getrennt):</p>
        
        <textarea id="themenInput" rows="5" placeholder="Künstliche Intelligenz&#10;Raumfahrt&#10;Psychologie"></textarea>
        
        <button onclick="triggerGitHubWorkflow()">Shorts in der Cloud starten 🚀</button>
        
        <div id="status">Bereit</div>
    </div>

    <script>
        async function triggerGitHubWorkflow() {
            // 1. Trage hier deine echten GitHub-Daten ein:
            const GITHUB_TOKEN = "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";
            const OWNER = "odessy104"; 
            const REPO = "Shortsgenerator";
            
            const statusDiv = document.getElementById("status");
            const rawInput = document.getElementById("themenInput").value;
            
            // Wandelt Zeilenumbrüche in Kommas um und entfernt leere Zeilen
            const formatierteThemen = rawInput
                .split('\n')
                .map(zeile => zeile.trim())
                .filter(zeile => zeile.length > 0)
                .join(', ') || "Künstliche Intelligenz";
            
            statusDiv.innerText = "Sende Anfrage an GitHub...";

            const url = `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/run_pipeline.yml/dispatches`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        ref: 'main', // Dein Haupt-Branch (z.B. main oder master)
                        inputs: {
                            themen: formatierteThemen
                        }
                    })
                });

                if (response.ok) {
                    statusDiv.innerText = "Erfolgreich gestartet! 🚀 Schau in GitHub Actions.";
                    alert("Shorts-Generierung gestartet für:\n" + formatierteThemen);
                } else {
                    statusDiv.innerText = "Fehler beim Starten (Code: " + response.status + ").";
                    alert("Fehler beim Starten des Workflows. Überprüfe Token, Repo-Namen und Branch.");
                }
            } catch (error) {
                console.error("Netzwerkfehler:", error);
                statusDiv.innerText = "Netzwerkfehler aufgetreten.";
            }
        }
    </script>

</body>
</html>
