<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Shorts Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ffffff;
        }
        button {
            background-color: #ff0033;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #cc0029;
        }
        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #a0a0a0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Shorts Cloud Generator</h1>
        <p style="font-size: 0.85rem; color: #888; margin-bottom: 20px;">
            Starte die vollautomatisierte Erstellung deines YouTube Shorts direkt über GitHub Actions.
        </p>
        
        <!-- Der Button zum Starten -->
        <button onclick="triggerGitHubWorkflow()">Short in der Cloud starten 🚀</button>
        
        <div id="status">Bereit</div>
    </div>

    <script>
        async function triggerGitHubWorkflow() {
            // Trage hier deine GitHub-Daten ein:
            const GITHUB_TOKEN = "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"; 
            const OWNER = "odessy104"; 
            const REPO = "Shortsgenerator"; 
            
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = "Sende Anfrage an GitHub...";

            const url = `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/run_pipeline.yml/dispatches`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        ref: 'main' // Dein Haupt-Branch (z.B. main oder master)
                    })
                });

                if (response.ok) {
                    statusDiv.innerText = "Erfolgreich gestartet! 🚀 Schau in GitHub Actions.";
                    alert("Shorts-Generierung in der Cloud gestartet! 🚀");
                } else {
                    statusDiv.innerText = "Fehler beim Starten.";
                    alert("Fehler beim Starten des Workflows. Überprüfe den Token und die Konsole.");
                }
            } catch (error) {
                console.error("Netzwerkfehler:", error);
                statusDiv.innerText = "Netzwerkfehler aufgetreten.";
            }
        }
    </script>

</body>
</html>
