<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts Generator Hub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f1117;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #161922;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid #222736;
        }
        h2 {
            margin-top: 0;
            color: #eab308;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        textarea, input[type="password"] {
            width: 100%;
            background: #0f1117;
            border: 1px solid #2e3548;
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            box-sizing: border-box;
        }
        textarea {
            height: 90px;
            resize: vertical;
        }
        textarea:focus, input[type="password"]:focus {
            outline: none;
            border-color: #eab308;
        }
        .settings-box {
            background: #1e222d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #2e3548;
        }
        .btn-start {
            width: 100%;
            background: #eab308;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-start:hover {
            background: #ca8a04;
        }
        .btn-save {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            margin-top: 8px;
        }
        .btn-save:hover {
            background: #2563eb;
        }
        #video-list-container {
            margin-top: 20px;
        }
        .video-card {
            background: #1e222d;
            padding: 15px;
            margin-top: 12px;
            border-radius: 8px;
            border: 1px solid #2e3548;
        }
        .video-title {
            color: #fff;
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 15px;
            word-break: break-word;
        }
        .btn-action-group {
            display: flex;
            gap: 10px;
        }
        .btn-copy {
            background: #eab308;
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-copy:hover {
            background: #ca8a04;
        }
        .btn-download {
            background: #3b82f6;
            color: #fff;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            display: inline-block;
            font-size: 13px;
        }
        .btn-download:hover {
            background: #2563eb;
        }
        .status-msg {
            margin-top: 15px;
            font-style: italic;
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
            padding: 10px;
            background: #0f1117;
            border-radius: 6px;
            border: 1px solid #2e3548;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎬 Shorts Generator Hub</h2>
        
        <!-- Token Einstellungen -->
        <div class="settings-box">
            <label for="tokenInput">⚙️ GitHub Personal Access Token:</label>
            <input type="password" id="tokenInput" placeholder="Dein GitHub Token (ghp_...)" />
            <button class="btn-save" onclick="saveToken()">💾 Token speichern</button>
            <span id="tokenStatus" style="font-size: 12px; color: #22c55e; margin-left: 10px;"></span>
        </div>

        <div class="input-group">
            <label for="themesInput">Wissenschaftliche Themen (kommagetrennt):</label>
            <textarea id="themesInput" placeholder="Geheimnisse des menschlichen Gedächtnisses, Erstaunliche Superkräfte von Tieren..."></textarea>
        </div>

        <button class="btn-start" onclick="triggerPipeline()">🚀 Pipeline auf GitHub starten</button>

        <div id="statusMessage" class="status-msg">Bereit.</div>

        <div id="video-list-container"></div>
    </div>

    <script>
        const GITHUB_USER = "odessy104";
        const GITHUB_REPO = "Shortsgenerator";
        const WORKFLOW_FILE = "run_pipeline.yml";

        window.onload = function() {
            let savedToken = localStorage.getItem("gh_token");
            if (savedToken) {
                document.getElementById("tokenInput").value = savedToken;
            }
            checkResults();
            checkPipelineStatus();
        };

        function saveToken() {
            let token = document.getElementById("tokenInput").value.trim();
            if (token) {
                localStorage.setItem("gh_token", token);
                let status = document.getElementById("tokenStatus");
                status.innerText = "Gespeichert!";
                setTimeout(() => status.innerText = "", 2000);
            } else {
                alert("Bitte gib einen gültigen Token ein.");
            }
        }

        async function triggerPipeline() {
            let themes = document.getElementById("themesInput").value.trim();
            let token = localStorage.getItem("gh_token") || document.getElementById("tokenInput").value.trim();
            let statusDiv = document.getElementById("statusMessage");

            if (!themes) {
                alert("Bitte gib mindestens ein Thema ein!");
                return;
            }

            if (!token) {
                alert("Bitte gib zuerst deinen GitHub Token ein und klicke auf 'Token speichern'!");
                return;
            }

            statusDiv.innerText = "⏳ Sende Start-Befehl an GitHub...";

            try {
                let response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ref: 'main',
                        inputs: {
                            themes: themes
                        }
                    })
                });

                if (response.status === 204) {
                    statusDiv.innerText = "✅ Erfolgreich gestartet! Der Workflow läuft auf GitHub.";
                } else {
                    let errData = await response.json().catch(() => ({}));
                    statusDiv.innerText = "❌ Fehler beim Start: " + (errData.message || response.statusText);
                }
            } catch (error) {
                statusDiv.innerText = "❌ Netzwerkfehler: " + error.message;
            }
        }

        async function checkPipelineStatus() {
            try {
                let response = await fetch('status.json?_=' + new Date().getTime());
                if (response.ok) {
                    let status = await response.json();
                    let statusDiv = document.getElementById("statusMessage");
                    if (status.running) {
                        statusDiv.innerHTML = `⏳ <b>Pipeline läuft aktiv:</b> ${status.message}`;
                    }
                }
            } catch (e) {
                // Status-Datei existiert eventuell noch nicht
            }
        }

        async function checkResults() {
            try {
                let response = await fetch('result.json?_=' + new Date().getTime());
                if (response.ok) {
                    let data = await response.json();
                    let container = document.getElementById('video-list-container');
                    container.innerHTML = "";

                    let videos = data.videos || (Array.isArray(data) ? data : [data]);

                    videos.forEach((vid, idx) => {
                        let card = document.createElement('div');
                        card.className = "video-card";
                        
                        card.innerHTML = `
                            <div class="video-title">Short #${vid.index || (idx + 1)}: ${vid.title}</div>
                            <div class="btn-action-group">
                                <button class="btn-copy" onclick="navigator.clipboard.writeText('${vid.title.replace(/'/g, "\\'")}')">📋 Titel kopieren</button>
                                <a class="btn-download" href="https://github.com/${GITHUB_USER}/${GITHUB_REPO}/releases" target="_blank">📥 Video herunterladen</a>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                }
            } catch (e) {
                // Keine Aktion erforderlich
            }
        }

        setInterval(checkResults, 15000);
        setInterval(checkPipelineStatus, 10000);
    </script>
</body>
</html>
